[project]
name = "data-analysis-agent"
version = "0.1.0"
description = "多 Agent + MCP 的数据分析助手"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4",
    "langgraph>=1.2",
    "langchain-ollama>=1.1",
    "langchain-mcp-adapters>=0.3",
    "mcp>=1.30",
    "sqlalchemy>=2.1",
    "pandas>=3.0",
    "matplotlib>=3.11",
    "pydantic-settings>=2.16",
]

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
